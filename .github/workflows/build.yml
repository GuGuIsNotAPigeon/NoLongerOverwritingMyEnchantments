# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: rename artifacts
        run: |
          MOD_NAME=$(sed -n 's/.*"name":[[:space:]]*"\([^"]*\)".*/\1/p' src/main/resources/fabric.mod.json | head -1 | sed 's/\.$//')
          MC_VERSION=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          MOD_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          for f in build/libs/*.jar; do
            [[ "$f" == *-sources.jar ]] && continue
            mv "$f" "build/libs/${MOD_NAME}-${MC_VERSION}-fabric-${MOD_VERSION}.jar"
          done
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/libs/*.jar
